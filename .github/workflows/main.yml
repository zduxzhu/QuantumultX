name: Update Nodes

on:
  schedule:
    # 每6小时执行一次 (UTC时间: 0:00, 6:00, 12:00, 18:00)
    - cron: "0 */6 * * *"
  # 也支持手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and convert nodes
        run: python fetch_nodes.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.txt
          git diff --staged --quiet || git commit -m "Auto-update nodes [skip ci]"
          git push
